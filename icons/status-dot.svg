<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- NEON//CORE mark — "Status Dot" -->
  <!-- Background: Background 2 (#11141C), Border: Divider (#2A3144) -->
  <rect x="0" y="0" width="96" height="96" rx="20" fill="#11141C"/>
  <rect x="0" y="0" width="96" height="96" rx="20" fill="none" stroke="#2A3144" stroke-width="1"/>

  <!-- Inactive ring: Divider (#2A3144) -->
  <circle cx="48" cy="48" r="26" fill="none" stroke="#2A3144" stroke-width="3"/>

  <!-- Active arc: System Green (#46FF88) -->
  <circle cx="48" cy="48" r="26" fill="none" stroke="#46FF88" stroke-width="3"
          stroke-dasharray="40 200" stroke-linecap="round" transform="rotate(-90 48 48)"/>

  <!-- Center point: Text Primary (#F2F5FA) -->
  <circle cx="48" cy="48" r="5" fill="#F2F5FA"/>
</svg>
