<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- NEON//CORE mark — "Status Dot" — monochrome variant -->
  <!-- For contexts that cannot render color: favicons, notification icons, print -->
  <!-- Uses currentColor so it inherits the surrounding text/icon color -->
  <circle cx="48" cy="48" r="26" fill="none" stroke="currentColor" stroke-width="3" opacity="0.35"/>
  <circle cx="48" cy="48" r="26" fill="none" stroke="currentColor" stroke-width="3"
          stroke-dasharray="40 200" stroke-linecap="round" transform="rotate(-90 48 48)"/>
  <circle cx="48" cy="48" r="5" fill="currentColor"/>
</svg>
